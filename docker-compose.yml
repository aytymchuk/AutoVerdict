services:
  api:
    build:
      context: ./backend
      dockerfile: src/AutoVerdikt.WebApi/Dockerfile
    ports:
      - "5065:8080"
    env_file:
      - .env
    environment:
      MongoDb__ConnectionString: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-example}@mongodb:27017/?authSource=admin
      # Inside the compose network Seq is reachable by service name, not localhost.
      OpenTelemetry__Otlp__Endpoint: http://seq:80/ingest/otlp
    depends_on:
      - mongodb
      - azurite
      - seq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_CLERK_PUBLISHABLE_KEY
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy

  mongodb:
    image: mongo:8.0
    platform: linux/amd64
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-example}
    volumes:
      - mongodb_data:/data/db

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/workspace

  seq:
    image: datalust/seq:2024.3
    platform: linux/amd64
    ports:
      - "5341:80"
    env_file:
      - .env
    environment:
      # Allow the browser-side OTLP trace exporter (frontend) to post cross-origin.
      # 5173 = `pnpm dev`/`make dev`, 3000 = dockerized web (`make up-prod`).
      SEQ_API_CORSALLOWEDORIGINS: "http://localhost:5173,http://localhost:3000"
    volumes:
      - seq_data:/data

volumes:
  mongodb_data:
  azurite_data:
  seq_data:
