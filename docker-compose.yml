services:
  api:
    build:
      context: ./backend
      dockerfile: src/AutoVerdikt.WebApi/Dockerfile
    ports:
      - "5065:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Clerk JWT validation — issuer and allowed frontend origin (azp / CORS).
      Clerk__Authority: ${Clerk__Authority:-}
      Clerk__AuthorizedParty: ${Clerk__AuthorizedParty:-http://localhost:5173}
      MongoDb__ConnectionString: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-example}@mongodb:27017/?authSource=admin&replicaSet=rs0
      # Inside the compose network Seq is reachable by service name, not localhost.
      OpenTelemetry__Otlp__Endpoint: http://seq:80/ingest/otlp
      # Whitelist gate (S-01.3). When true, only whitelisted users can access product routes.
      WHITELIST_ENABLED: ${WHITELIST_ENABLED:-false}
      SendGrid__ApiKey: ${SENDGRID_API_KEY:-}
      SendGrid__FromEmail: ${SENDGRID_FROM_EMAIL:-}
      SendGrid__SenderName: ${SENDGRID_SENDER_NAME:-AutoCheck AI}
      # OpenRouter — LLM extraction (maps to OpenRouter:* in appsettings).
      OpenRouter__ApiKey: ${OpenRouter__ApiKey:-${OPENROUTER_API_KEY:-}}
      OpenRouter__BaseUrl: ${OpenRouter__BaseUrl:-${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}}
      OpenRouter__ExtractionModel: ${OpenRouter__ExtractionModel:-${OPENROUTER_EXTRACTION_MODEL:-google/gemini-2.5-flash}}
      OpenRouter__SiteUrl: ${OpenRouter__SiteUrl:-${OPENROUTER_SITE_URL:-https://autoverdikt.com}}
      OpenRouter__SiteName: ${OpenRouter__SiteName:-${OPENROUTER_SITE_NAME:-AutoVerdikt}}
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      azurite:
        condition: service_started
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        - VITE_CLERK_PUBLISHABLE_KEY
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      # Vite proxy target inside the compose network (browser still uses /api on :5173).
      VITE_API_TARGET: http://api:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  mongodb:
    image: mongo:8.0
    platform: linux/amd64
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-example}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongodb-init:
    image: mongo:8.0
    platform: linux/amd64
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-example}
    entrypoint: >
      bash -c "
      until mongosh mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@mongodb:27017/admin --eval 'db.runCommand({ ping: 1 })' 2>/dev/null; do sleep 1; done;
      mongosh mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@mongodb:27017/admin --eval \"
        try { rs.status(); } catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }); }
      \"
      "
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/workspace

  seq:
    image: datalust/seq:2024.3
    platform: linux/amd64
    ports:
      - "5341:80"
    env_file:
      - .env
    environment:
      # Allow the browser-side OTLP trace exporter (frontend) to post cross-origin.
      SEQ_API_CORSALLOWEDORIGINS: "http://localhost:5173"
    volumes:
      - seq_data:/data

volumes:
  mongodb_data:
  azurite_data:
  seq_data:
  web_node_modules:
