# Serena MCP — Project Configuration for AutoVerdikt
# Place this file at: <repo-root>/.serena/project.yml
#
# This config is designed for the MONOREPO root (the folder that contains
# both `backend/` and `frontend/`).  Run Serena from there:
#   serena project create --language csharp --language typescript
#
# Language backends used:
#   csharp     — Microsoft Roslyn Language Server (auto-downloaded, requires .NET 10+)
#   typescript — typescript-language-server (auto-downloaded via npm)

project_name: autoverdikt

# ─── Language Servers ────────────────────────────────────────────────────────
# Both are needed because the repo is a C# + React/TypeScript monorepo.
languages:
  - csharp
  - typescript

# Roslyn needs .NET 10 on PATH (matches TargetFramework net10.0 in Directory.Build.props).
# No extra ls_specific_settings needed unless you want to pin a Roslyn package version:
# ls_specific_settings:
#   csharp:
#     csharp_language_server_version: "5.5.0-2.26078.4"   # optional pin

# ─── Ignore Rules ─────────────────────────────────────────────────────────────
# Respect .gitignore automatically (covers dist/, .env, *.local, etc.)
ignore_all_files_in_gitignore: true

# Extra paths that are noisy or generated and should never be indexed:
ignore_paths:
  # .NET build output
  - "backend/**/bin"
  - "backend/**/obj"
  # Node / pnpm
  - "frontend/node_modules"
  - "frontend/dist"
  - "frontend/test-results"
  # IDE / tooling artefacts
  - ".git"
  - "**/.serena/cache"
  - "**/.serena/logs"
  # Lock files are too large and rarely useful for symbol search
  - "frontend/pnpm-lock.yaml"

# ─── Modes ────────────────────────────────────────────────────────────────────
# editing  — enables direct code-modification tools
# interactive — conversational back-and-forth style
default_modes:
  - editing
  - interactive

# ─── Write Access ─────────────────────────────────────────────────────────────
# Agent is allowed to write everywhere inside the project root.
# Set to read_only: true temporarily when you only want analysis.
read_only: false

# ─── Initial Instructions ─────────────────────────────────────────────────────
# Loaded automatically when the project is activated.
# Captures critical architecture rules from all AGENTS.md files so the agent
# never has to re-read them on every task.
initial_instructions: |
  ## AutoVerdikt — Architecture Primer

  AutoVerdikt is an AI-powered used-car analysis platform.
  The monorepo is split into two top-level directories:
    • backend/   — .NET 10 / C#, Clean Architecture
    • frontend/  — React 19 + TypeScript + Vite 8, pnpm

  ════════════════════════════════════════
  BACKEND — Clean Architecture Layers
  ════════════════════════════════════════

  Dependency direction (inner → outer only):

    Domain ← Application ← { Agents | Infrastructure | Store }
                                        ↑
                                     WebApi  (composition root)

  Key rules (enforced by AutoVerdikt.Architecture.Tests via NetArchTest.Rules):
  • Domain has ZERO project or NuGet dependencies.
  • Application references only Domain.
  • Agents, Infrastructure, Store are strict siblings — they must NEVER
    reference each other.
  • WebApi may reference Application, Infrastructure, Store but NOT Agents.

  Layer responsibilities:
  • Domain        — pure C# record entities, no persistence annotations.
                    IDs use Guid.CreateVersion7(DateTimeOffset), not Guid.NewGuid().
                    TimeProvider is injected; never call DateTime.UtcNow directly.
                    State-transition methods use `with`-expressions (Approve, Reject, …).
  • Application   — commands/queries (Mediator.Abstractions IRequest<T>),
                    repository interfaces, FluentResults for error signalling.
                    Never throw custom exceptions for business failures.
                    Error classes: sealed, inherits DomainError (which inherits FluentResults.Error),
                    placed in <Feature>/Errors/ or shared Errors/.
  • Agents        — LLM/AI integrations; depends only on Application.
  • Infrastructure— External API integrations (SendGrid, …); depends only on Application.
  • Store         — MongoDB persistence; internal *Document types with BSON attributes,
                    never exposed outside; indexes created in IHostedService initializers.
  • WebApi        — Minimal API endpoints, composition root, FluentValidation, Clerk JWT auth.
                    Endpoints must be thin (map DTO → command → send → map result → HTTP response).
                    Result failures are translated via ToProblemResult() using typed error checks
                    (OfType<TDomainError>()) — NEVER string-match error messages.
                    Routes, names, summaries defined as internal const in *EndpointConstants.

  Coding conventions (backend):
  • ImplicitUsings enabled; do NOT add redundant usings — IDE0005 is a warning-as-error.
  • All NuGet versions are centralised in Directory.Packages.props (CPM).
  • TreatWarningsAsErrors = true.
  • Tests: xUnit + Shouldly (never raw Assert.*).
    Integration tests use Testcontainers.MongoDb + AutoFixture; no mocked DB.
    Auth mocked via TestAuthHandler; real Clerk JWTs not needed.
  • Architecture tests run in AutoVerdikt.Architecture.Tests — ensure they still pass
    after every structural change.

  Four-step approach for any coding task:
    1. Locate change areas (find_symbol, get_symbols_overview).
    2. Find similar existing implementations to use as reference.
    3. Identify reusable/extensible code before writing new code.
    4. Implement with TDD where possible; keep strict scope.

  ════════════════════════════════════════
  FRONTEND — React / TypeScript
  ════════════════════════════════════════

  Stack: React 19, TypeScript (strict), Vite 8, Tailwind CSS 4, pnpm.
  Router: react-router-dom v7.  State: Clerk (auth) + React context + useState.
  HTTP: custom ApiClient wrapping ky; token obtained via Clerk getToken.
  i18n: three locales — en / pl / uk.  Russian (ru) is BLOCKED at the i18n
        provider level; it maps to Ukrainian.

  Auth flow:
    /          → LandingPage (public)
    /auth      → Clerk SignIn
    /auth/callback → AuthCallbackPage (resolves user status, redirects)
    /register  → RegisterRoute (authenticated but not registered)
    /waiting   → WhitelistRoute (registered but not whitelisted)
    /home      → ProtectedRoute (registered + whitelisted)
    /chat      → ProtectedRoute (registered + whitelisted)

  Route guards live in shared/components/ProtectedRoute.tsx.
  User status resolved in shared/context/userStatusProvider.tsx via
  UserStatusContext (status: loading | error | unauthenticated |
                                unregistered | not_whitelisted | registered).

  CSS / Design:
  • Design tokens are in frontend/src/app/styles/global.css under @theme {}.
  • Use Tailwind utility classes that reference CSS custom properties
    (e.g. bg-surface-container, text-on-surface).
  • Fonts: Space Grotesk (body), JetBrains Mono (data/code).
  • Material Symbols Outlined icon font (used via <span className="material-symbols-outlined">).
  • Global helper classes: inner-glow, scan-line.

  API layer (frontend/src/shared/api/):
  • research.ts  — ResearchApiClient (list, create, get, rename, delete)
  • users.ts     — UsersApiClient (getMe, register)
  • waitlist.ts  — WaitlistApiClient (submitRequest)
  • authTokenBridge.ts — singleton bridge so non-hook code can get Clerk token.

  Testing (frontend):
  • Vitest + @testing-library/react + jsdom.
  • Coverage thresholds: lines/branches/functions/statements ≥ 60%.
  • Reports written to frontend/test-results/.